rney"],R0=["Surgeon-Led Hair Transplants","Natural Hairline Design","EMI Plans Available"],Tm=[{step:"01",icon:"consultation",title:"Consultation & Hairline Planning",copy:"The surgeon evaluates your hair loss pattern, donor area availability, facial proportions, and future hair loss progression to create a personalized and natural-looking hairline design."},{step:"02",icon:"anaesthesia",title:"Local Anaesthesia",copy:"Local anaesthesia is administered to both the donor and recipient areas to ensure a comfortable and virtually pain-free experience throughout the procedure."},{step:"03",icon:"design",title:"Recipient Site Creation",copy:"Tiny recipient sites are carefully created using specialized micro blades or needles to achieve optimal density, natural angulation, and realistic hair growth patterns."},{step:"04",icon:"extraction",title:"Donor Follicular Unit Extraction",copy:"Healthy follicular units are individually extracted from the donor area using advanced micro-punch techniques while preserving surrounding tissue and donor density."},{step:"05",icon:"implantation",title:"Graft Implantation",copy:"The extracted follicles are meticulously implanted to achieve natural density and direction using implanters or double-forceps no-root-touch techniques for maximum graft protection."},{step:"06",icon:"followup",title:"Post-Procedure Care & Recovery",copy:"The treated area is cleaned, detailed post-operative instructions are provided, and supportive medications may be recommended to promote healing, optimize hair growth, and maintain existing hair."}],H0=["Donor-safe graft planning","Natural hairline design","FUE and DHT techniques","EMI plans available","Regular follow-ups"],wm=[{before:"/images/a1.jpeg",after:"/images/b1.jpeg",beforeAlt:"Patient before hair transplant showing a receding frontal hairline",afterAlt:"Patient after hair transplant showing a restored frontal hairline",label:"FUE - Frontal Hairline",note:"3,000 Grafts • 12-Month Result"},{before:"/image  treatment experience was excellent."},{avatar:"V",name:"Vijit Jaiswal",time:"15 days ago",text:"I personally recommend Dr. Bhawna Bhardwaj, as I underwent hair transplant by her. The process was clear, comfortable, and professional."},{avatar:"S",name:"Sahil Sharma",time:"3 weeks ago",text:"Very good experience at Renova Aura. The staff is polite, the clinic is clean, and the doctor explains the treatment properly."}],U0=[{question:"Will there be scars after a hair transplant?",answer:"With modern techniques like FUE, scarring is minimal and usually not noticeable, especially once your hair grows back. Tiny extraction points in the donor area typically heal well and are often difficult to detect without close examination."},{question:"Does a hair transplant look natural?",answer:"Yes. When performed by an experienced surgeon, the transplanted hair blends naturally with your existing hair. Careful attention to hairline design, graft placement, density, and hair direction helps create results that look natural and age appropriately."},{question:"Are there any risks or side effects of a hair transplant?",answer:"Hair transplant procedures are generally safe when performed by qualified specialists. Temporary swelling, redness, itching, scab formation, or mild discomfort may occur during the healing period. Serious complications are uncommon when the procedure is performed correctly and post-procedure instructions are followed."},{question:"Can I style or cut my transplanted hair?",answer:"Yes. After your scalp has healed, you can cut, style, and groom your transplanted hair just like your natural hair."},{question:"How long will my transplanted hair last?",answer:"Hair transplanted from the donor area is generally resistant to the hormonal factors responsible for pattern hair loss. These follicles can continue growing for many years. However, maintaining existing non-transplanted hair is equally important for long-term results and overall appearance."},{question:"Will I need more than one hair transplant in my lifetime?",answer:"Some patients achieve their desired result with a single procedure, while others may require additional sessions in the future if hair loss progresses. This depends on factors such as age, pattern of hair loss, donor availability, and long-term goals."},{question:"When can I wash my hair after a hair transplant?",answer:"Patients are usually advised to wait for a specific period before the first wash and follow a gentle washing protocol during the initial healing phase. Detailed instructions are provided after the procedure to help protect the grafts and support proper healing."},{question:"Can a hair transplant improve density in thinning areas?",answer:"Yes. Hair transplantation can be used to improve the appearance of density in thinning areas. The treatment plan is customized based on the amount of existing hair, donor capacity, and long-term restoration goals to ensure natural-looking coverage."},{question:"What happens if my hair loss continues after the transplant?",answer:"A hair transplant restores hair to specific areas but does not stop future hair loss in untreated regions. This is why long-term planning is important. Additional treatments or hair maintenance strategies may be recommended to help preserve existing hair and maintain a balanced appearance."},{question:"Will my transplanted hair require special care in the future?",answer:"Once the transplanted follicles have healed and established growth, they can generally be treated like natural hair. You can wash, cut, and style them normally. However, maintaining overall scalp and hair health remains important for long-term results."}];function G0(){he.useEffect(()=>{const i=Array.from(document.querySelectorAll("[data-reveal]"));if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){i.forEach(o=>o.classList.add("is-visible"));return}const u=new IntersectionObserver(o=>{o.forEach(c=>{c.isIntersecting&&(c.target.classList.add("is-vi
